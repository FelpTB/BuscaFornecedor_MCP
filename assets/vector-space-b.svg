<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Grafo de climatização com conjuntos de nichos de clientes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A223A"/>
      <stop offset="55%" stop-color="#0F3052"/>
      <stop offset="100%" stop-color="#1B4F72"/>
    </linearGradient>
    <style>
      .lbl { font-family: Inter, system-ui, sans-serif; fill: rgba(255,255,255,0.88); }
      .lbl-sm { font-size: 11px; font-weight: 600; }
      .lbl-xs { font-size: 10px; font-weight: 500; fill: rgba(255,255,255,0.7); }
      .edge { stroke: rgba(255,255,255,0.35); stroke-width: 1.4; fill: none; }
      .edge-soft { stroke: rgba(126,200,232,0.22); stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
      .node { stroke: rgba(255,255,255,0.35); stroke-width: 1; }
      .set { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.45); stroke-width: 1.5; }
      .sector { fill: none; stroke: rgba(126,200,232,0.55); stroke-width: 1.5; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <path d="M40 120 H600 M40 200 H600 M40 280 H600 M40 360 H600"/>
    <path d="M120 60 V420 M220 60 V420 M320 60 V420 M420 60 V420 M520 60 V420"/>
  </g>

  <!-- Setor Climatização -->
  <ellipse class="sector" cx="250" cy="240" rx="210" ry="175"/>
  <text class="lbl lbl-sm" x="250" y="78" text-anchor="middle">Climatização</text>

  <!-- Conjuntos de clientes (bem definidos, pouco overlap) -->
  <ellipse class="set" cx="250" cy="145" rx="118" ry="58"/>
  <text class="lbl lbl-xs" x="250" y="98" text-anchor="middle">Clientes · Ind. farmacêutica</text>

  <ellipse class="set" cx="250" cy="240" rx="105" ry="48"/>
  <text class="lbl lbl-xs" x="250" y="205" text-anchor="middle">Clientes · Ind. alimentícia</text>

  <ellipse class="set" cx="250" cy="340" rx="118" ry="58"/>
  <text class="lbl lbl-xs" x="250" y="395" text-anchor="middle">Clientes · Mineradoras</text>

  <!-- Arestas: só vizinhos próximos DENTRO de cada cluster -->
  <!-- Farm -->
  <g class="edge">
    <line x1="210" y1="135" x2="240" y2="120"/>
    <line x1="240" y1="120" x2="280" y2="128"/>
    <line x1="280" y1="128" x2="300" y2="155"/>
    <line x1="210" y1="135" x2="230" y2="165"/>
    <line x1="230" y1="165" x2="270" y2="168"/>
  </g>
  <!-- Ali -->
  <g class="edge">
    <line x1="215" y1="240" x2="245" y2="228"/>
    <line x1="245" y1="228" x2="280" y2="242"/>
    <line x1="215" y1="240" x2="250" y2="255"/>
    <line x1="250" y1="255" x2="280" y2="242"/>
  </g>
  <!-- Miner -->
  <g class="edge">
    <line x1="210" y1="330" x2="245" y2="318"/>
    <line x1="245" y1="318" x2="285" y2="332"/>
    <line x1="210" y1="330" x2="235" y2="360"/>
    <line x1="235" y1="360" x2="275" y2="358"/>
    <line x1="275" y1="358" x2="285" y2="332"/>
  </g>

  <!-- Ligações suaves entre clusters (proximidade no setor, sem emaranhar) -->
  <g class="edge-soft">
    <line x1="250" y1="168" x2="250" y2="228"/>
    <line x1="250" y1="255" x2="250" y2="318"/>
  </g>

  <!-- Nós farm -->
  <g>
    <circle class="node" cx="210" cy="135" r="6" fill="#3D9BD0"/>
    <circle class="node" cx="240" cy="120" r="5.5" fill="#7EC8E8"/>
    <circle class="node" cx="280" cy="128" r="6" fill="#3D9BD0"/>
    <circle class="node" cx="300" cy="155" r="5" fill="#2A9D8F"/>
    <circle class="node" cx="230" cy="165" r="5.5" fill="#3D9BD0"/>
    <circle class="node" cx="270" cy="168" r="5" fill="#7EC8E8"/>
  </g>

  <!-- Nós ali -->
  <g>
    <circle class="node" cx="215" cy="240" r="6" fill="#2A9D8F"/>
    <circle class="node" cx="245" cy="228" r="5.5" fill="#3D9BD0"/>
    <circle class="node" cx="280" cy="242" r="6" fill="#7EC8E8"/>
    <circle class="node" cx="250" cy="255" r="5.5" fill="#3D9BD0"/>
  </g>

  <!-- Nós miner -->
  <g>
    <circle class="node" cx="210" cy="330" r="6" fill="#3D9BD0"/>
    <circle class="node" cx="245" cy="318" r="5.5" fill="#7EC8E8"/>
    <circle class="node" cx="285" cy="332" r="6" fill="#2A9D8F"/>
    <circle class="node" cx="235" cy="360" r="5.5" fill="#3D9BD0"/>
    <circle class="node" cx="275" cy="358" r="5" fill="#7EC8E8"/>
  </g>

  <!-- Outliers distantes -->
  <g class="edge">
    <line x1="520" y1="130" x2="545" y2="148"/>
    <line x1="530" y1="320" x2="555" y2="340"/>
  </g>
  <circle class="node" cx="520" cy="130" r="5" fill="#7EC8E8"/>
  <circle class="node" cx="545" cy="148" r="5" fill="#3D9BD0"/>
  <circle class="node" cx="560" cy="125" r="4.5" fill="#2A9D8F"/>
  <text class="lbl lbl-xs" x="540" y="108" text-anchor="middle">Consultoria tributária</text>

  <circle class="node" cx="530" cy="320" r="5" fill="#3D9BD0"/>
  <circle class="node" cx="555" cy="340" r="5" fill="#7EC8E8"/>
  <circle class="node" cx="545" cy="360" r="4.5" fill="#2A9D8F"/>
  <text class="lbl lbl-xs" x="545" y="385" text-anchor="middle">Software ERP</text>
</svg>
